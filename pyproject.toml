[project]
name = "simcore"
version = "0.1.0"
description = "ConsumerSim simulation engine"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "igraph>=1.0.0",
    "leidenalg>=0.12.0",
    "networkx>=3.6.1",
    "numpy>=2.5.3",
    "opentelemetry-api>=1.44.0",
    "pyarrow>=25.0.1",
    "pydantic>=2.9",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
]

[project.optional-dependencies]
otel = [
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
]
web = [
    "fastapi>=0.115",
    "uvicorn>=0.53",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112",
    "opentelemetry-sdk>=1.44.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["simcore"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
