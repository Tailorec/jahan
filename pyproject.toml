[project]
name = "simcore"
version = "0.1.0"
description = "ConsumerSim simulation engine"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["simcore"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
