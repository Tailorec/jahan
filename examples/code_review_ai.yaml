# The real-data study: an AI code-review assistant, tested on the one source that measures both
# demographics and developer attitudes on the same person — Stack Overflow (ADR 0018, ADR 0019).
# Its audiences are grounded filters on measured attributes, not projections.

product:
  name: Codepilot Review
  category: software_dev
  description: An AI code-review assistant that comments on pull requests and flags risky changes

price:
  amount: 19.00
  currency: USD

claims:
  - text: Catches the bug class reviewers miss most often
    source: user_asserted
  - text: Fits into existing pull-request review without new tooling
    source: assumed

target_market: Professional and advanced-student software developers who review code

# Grounded filters on attributes Stack Overflow measures on the same row it measures attitudes on.
audiences:
  - name: ai_skeptics
    share: 0.5
    attribute_filters:
      att_ai: [Skeptical, Opposed]
  - name: senior_engineers
    share: 0.5
    attribute_filters:
      years_experience: { range: [6-10, 20+] }

ontology_version: 1.0.0
