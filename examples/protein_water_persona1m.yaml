# The same concept as `protein_water.yaml`, written against the attributes the Persona 1M
# release actually carries. The other example names `age`, `sex`, `exercise_frequency` and
# `diet_protein_focus`; the corpus spells them `age_bracket`, `gender_identity`,
# `lstyle_exercise_freq` and `lstyle_diet_type`, so only this one can draw from it.
#
# `--fake` cannot tell the two apart: the synthetic corpus is generated from whatever names
# the study asks for, so every attribute exists by construction.

product:
  name: Protein water
  category: beverage_protein_persona1m
  description: Clear protein-infused water with 20g whey isolate

price:
  amount: 2.49
  currency: USD

claims:
  - text: 20g protein with zero sugar
    source: user_asserted
    evidence_url: https://example.com/nutrition-panel
  - text: Hydrates like water, not milk
    source: assumed
  - text: Preferred over milky shakes after workouts
    source: public_source
    evidence_url: https://example.com/category-report

competitors:
  - name: Clear whey shooter
    price:
      amount: 2.99
      currency: USD
    claims:
      - Shooter format, 25g protein
  - name: Electrolyte water

target_market: US urban adults 25-40 who train at least weekly

# Both audiences filter on attributes the release carries, with the release's own labels.
audiences:
  - name: gym_regulars
    share: 0.6
    attribute_filters:
      lstyle_exercise_freq: Daily
  - name: protein_dieters
    share: 0.4
    attribute_filters:
      health_fitness_level: Fit

assumptions:
  - text: Respondents distinguish clear from milky protein formats
    source: user_asserted

ontology_version: 1.0.0
