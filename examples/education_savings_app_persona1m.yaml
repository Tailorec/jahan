# A concept test for a children's education-savings app, written against attributes the Persona 1M release
# populates densely (life_stage 55%, age_bracket 82%, region 90%, highest_education 77%, employment 84%).
# An earlier draft of this study defined its audiences by a budgeting habit; the corpus carries that
# attribute for 0.04% of its measured personas, so it could not have been drawn. What can be studied is
# bounded by what is populated, not by what sounds right.
#
# The question is deliberately modest. It is NOT "would people buy this": trust is UNCALIBRATED and nothing
# here has been checked against human intent. It is a directional check, with the expectation written down
# BEFORE the run:
#
#   1. parents_of_young_kids should show the highest stated purchase intent of the three audiences.
#      (This is the confident prediction: the product is about their situation.)
#   2. early_career versus retirees: NO directional prediction. Retirees might think of grandchildren and
#      early-career adults might think of future children, so the order is not obvious. Exploratory only.
#
# If the parents do not come out on top, that is the more interesting result. If they do, it shows the
# conditioning carries a life-stage cue into an answer in a domain the engine has not seen before, and
# nothing more. It is a manipulation check, not a validation.

product:
  name: Children's education savings app
  category: education_savings_app
  description: A phone app that sets aside a small amount from each paycheck toward a child's future education and shows how the fund is growing

price:
  amount: 4.99
  currency: USD

claims:
  - text: Sets money aside automatically each payday, so saving for a child's education does not depend on remembering to do it
    source: user_asserted
  - text: Shows in one place how the education fund is growing toward a target you choose
    source: user_asserted
  - text: Lets relatives contribute to the same fund on birthdays and holidays
    source: assumed

competitors:
  - name: A savings account you set up yourself
  - name: A government or employer education savings plan

target_market: Adults at very different life stages, from those raising young children to those who have retired

audiences:
  - name: parents_of_young_kids
    share: 0.4
    attribute_filters:
      life_stage: Parent of young kids
  - name: early_career
    share: 0.3
    attribute_filters:
      life_stage: Early career
  - name: retirees
    share: 0.3
    attribute_filters:
      life_stage: Retirement

assumptions:
  - text: A person can judge a savings app from a two-sentence description and a price
    source: user_asserted

ontology_version: 1.0.0
