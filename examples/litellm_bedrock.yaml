# A local OpenAI-compatible gateway in front of AWS Bedrock (ADR 0021).
#
# The engine speaks exactly two endpoints — /v1/chat/completions and /v1/embeddings — to whatever URL
# SIMCORE_INFERENCE_BASE_URL names. If you already have an OpenAI-compatible endpoint you do not need this
# file at all: point the variable at yours. This exists because Bedrock is not OpenAI-compatible and does
# not serve embeddings on its compatible surface.
#
#   uvx --from "litellm[proxy]" litellm --config examples/litellm_bedrock.yaml --port 4000
#
# It uses your own AWS credentials (`aws sts get-caller-identity` must work) in the region below.
#
# The engine owns retries, fallbacks and caching, so all three stay OFF here: a gateway retry hides an
# attempt from the trace, a substitution the study did not name is a Pin Failure, and a gateway cache cannot
# honour the engine's per-seed sample key. Pins live on the study, never in this file.

model_list:
  - model_name: amazon.nova-micro-v1:0            # the study pins this exact id as its chat model
    litellm_params:
      model: bedrock/amazon.nova-micro-v1:0
      aws_region_name: us-east-1
    rpm: 1000
    tpm: 400000

  - model_name: amazon.titan-embed-text-v2:0      # the study pins this exact id as its embedding model
    litellm_params:
      model: bedrock/amazon.titan-embed-text-v2:0
      aws_region_name: us-east-1
    rpm: 60                                       # Titan v2's default Bedrock quota
    tpm: 300000

litellm_settings:
  num_retries: 0
  request_timeout: 120
  cache: false
  fallbacks: []

router_settings:
  optional_pre_call_checks:
    - enforce_model_rate_limits
