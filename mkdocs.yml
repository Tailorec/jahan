site_name: Jahan
site_description: An open, reproducible engine for simulating how a population of LLM personas reacts to a product — feeds, forums, word of mouth and survey waves, every number traceable to the turn that produced it.
site_author: Faishal Manzar
site_url: https://tailorec.github.io/jahan/
repo_url: https://github.com/Tailorec/jahan
repo_name: Tailorec/jahan
edit_uri: edit/master/docs/
copyright: Copyright 2026 Faishal Manzar · Functional Source License 1.1 (Apache-2.0 future license)

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: teal
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: teal
      toggle: { icon: material/weather-sunny, name: Light mode }

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: { permalink: true }
  - pymdownx.details
  - footnotes
  # Formulas are written as $...$ and $$...$$ and typeset by MathJax in the browser.
  - pymdownx.arithmatex: { generic: true }
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - { name: mermaid, class: mermaid, format: !!python/name:pymdownx.superfences.fence_code_format }
  # The glossary lives at the repository root as CONTEXT.md and is included, never copied.
  - pymdownx.snippets: { base_path: ["."], check_paths: true }

# Evaluation partitions and scripts are evidence kept beside their write-ups, not pages.
exclude_docs: |
  *.py
  *.json
  *.parquet

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search

nav:
  - Home: index.md
  - Getting started:
      - Install: getting-started/install.md
      - Your first study: getting-started/first-study.md
      - Running against real models: getting-started/real-models.md
  - Concepts:
      - How a study works: concepts/index.md
      - The brief: concepts/brief.md
      - Personas and the population: concepts/population.md
      - The social network: concepts/social-network.md
      - Scenarios and worlds: concepts/scenarios-and-worlds.md
      - Channels: concepts/channels.md
      - Beliefs, memory and reflection: concepts/beliefs-and-memory.md
      - Measuring purchase intent: concepts/measuring-intent.md
      - The trace: concepts/trace.md
      - Results and trust: concepts/results-and-trust.md
      - Limitations: concepts/limitations.md
  - Research:
      - Methodology: research/methodology.md
      - Results so far: research/results.md
      - Threats to validity: research/threats-to-validity.md
      - Related work: research/related-work.md
      - References: research/references.md
  - Reference:
      - Glossary: reference/glossary.md
  - Design records:
      - Architecture: FINAL_ARCH.md
      - Salvage inventory: SALVAGE.md
      - Decisions (ADRs): adr/index.md
      - Module specifications (PRDs): prd/index.md
